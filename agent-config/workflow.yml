name: Agent configuration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-config-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read immutable source revision
        id: source
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync(".agents/manifest.json")); if(m.source.repository!=="onsager-ai/dev-skills" || !/^[0-9a-f]{40}$/.test(m.source.revision)) throw Error("Invalid source"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `revision=${m.source.revision}\n`);'
      - uses: actions/checkout@v4
        with:
          repository: onsager-ai/dev-skills
          ref: ${{ steps.source.outputs.revision }}
          path: .agent-source
          persist-credentials: false
      - name: Verify generated files against pinned upstream
        run: node .agent-source/agent-config/sync.mjs --check --source .agent-source

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare reviewed update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git clone --quiet --depth 1 https://github.com/onsager-ai/dev-skills.git "$RUNNER_TEMP/dev-skills"
          revision=$(git -C "$RUNNER_TEMP/dev-skills" rev-parse HEAD)
          branch="bot/agent-config-${revision:0:12}"
          existing=$(gh pr list --head "$branch" --state all --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "An update for this source revision already exists."
            exit 0
          fi
          node .agents/sync.mjs --check
          node "$RUNNER_TEMP/dev-skills/agent-config/sync.mjs" --source "$RUNNER_TEMP/dev-skills" --revision "$revision"
          node .agents/sync.mjs --check --source "$RUNNER_TEMP/dev-skills"
          if git diff --quiet; then exit 0; fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AGENTS.md .agents .claude/skills .github/workflows/agent-config.yml
          git commit -m "chore: sync agent configuration from dev-skills"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/agent-config-pr.md" <<'BODY'
          Update selected shared prompts, skill dependencies and native discovery projections from one immutable dev-skills revision. Repository-owned guidance and local canonical skills retain ownership.

          Validation: offline drift check and exact pinned-upstream comparison passed before publication. The repository Actions token does not trigger additional PR workflows; run required product checks through the repository's supported process before merging. This workflow never merges.
          BODY
          gh pr create --draft --base "$BASE_BRANCH" --head "$branch" --title "chore: update shared agent configuration" --body-file "$RUNNER_TEMP/agent-config-pr.md"
